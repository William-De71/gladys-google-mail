<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Google Mail integration for Gladys Assistant (illustration,
       no Google or Gmail logo). Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#1b3a63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>
  <g stroke="#213f66" stroke-width="1">
    <path d="M0 89 H800 M0 178 H800 M0 267 H800 M0 356 H800 M0 445 H800"/>
    <path d="M100 0 V534 M200 0 V534 M300 0 V534 M400 0 V534 M500 0 V534 M600 0 V534 M700 0 V534"/>
  </g>
  <ellipse cx="260" cy="280" rx="260" ry="200" fill="url(#glow)"/>

  <!-- the envelope and the unread list -->
  <rect x="74" y="104" width="360" height="350" rx="22" fill="#000000" opacity="0.28"/>
  <rect x="70" y="92" width="360" height="350" rx="22" fill="#ffffff"/>
  <rect x="70" y="92" width="360" height="62" rx="22" fill="#2f6fde"/>
  <rect x="70" y="132" width="360" height="22" fill="#2f6fde"/>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <rect x="96" y="113" width="30" height="22" rx="3"/>
    <path d="M96 116 l15 11 l15 -11"/>
  </g>
  <rect x="140" y="117" width="140" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
  <rect x="352" y="112" width="52" height="24" rx="12" fill="#ffffff"/>
  <rect x="366" y="120" width="24" height="8" rx="4" fill="#2f6fde"/>

  <!-- row 1: unread, important -->
  <circle cx="106" cy="196" r="7" fill="#2f6fde"/>
  <rect x="126" y="186" width="170" height="12" rx="6" fill="#273449"/>
  <rect x="126" y="205" width="120" height="9" rx="4.5" fill="#b4bfcf"/>
  <rect x="320" y="184" width="86" height="26" rx="13" fill="#fff1d6"/>
  <rect x="334" y="193" width="58" height="8" rx="4" fill="#f59f00"/>
  <!-- row 2: unread -->
  <circle cx="106" cy="262" r="7" fill="#2f6fde"/>
  <rect x="126" y="252" width="140" height="12" rx="6" fill="#273449"/>
  <rect x="126" y="271" width="100" height="9" rx="4.5" fill="#b4bfcf"/>
  <!-- row 3: read -->
  <rect x="126" y="322" width="150" height="12" rx="6" fill="#c9d1dd"/>
  <rect x="126" y="341" width="90" height="9" rx="4.5" fill="#dde3eb"/>
  <!-- vacation responder switch -->
  <rect x="98" y="378" width="56" height="30" rx="15" fill="#2fb344"/>
  <circle cx="139" cy="393" r="11" fill="#ffffff"/>
  <rect x="170" y="388" width="130" height="10" rx="5" fill="#273449"/>

  <!-- link to the house (Gladys) -->
  <g fill="none" stroke="#5fd08f" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 13">
    <path d="M450 268 H560"/>
  </g>
  <g transform="translate(640 268)">
    <circle r="62" fill="#14304f" stroke="#7fb8ff" stroke-width="4"/>
    <path d="M-30 4 L0 -24 L30 4 M-20 -4 V26 H20 V-4" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-7" y="8" width="14" height="18" fill="#ffffff"/>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="640" y="380" font-size="30" font-weight="bold">Google Mail</text>
    <text x="640" y="412" font-size="18" fill="#a9c4ea">Gladys Assistant</text>
  </g>
</svg>
